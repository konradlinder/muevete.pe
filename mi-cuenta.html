<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuenta | muévete.pe</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0046B8; --azul-menu:#0051C2; --amarillo:#FFDB03; --blanco:#F7F7F7;
  --fondo:#F6F6F6; --negro:#000; --rojo:#CC3D00;
  --poppins:"Poppins",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--poppins);font-weight:600;background:var(--fondo);color:var(--negro);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ---------- MENÚ (igual que el inicio) ---------- */
.right{display:flex;gap:38px;align-items:flex-start;position:fixed;top:calc(23px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:20}
.menu{display:flex;background:var(--azul-menu);border-radius:999px;box-shadow:0 1px 4px rgba(179,179,179,.6);overflow:hidden}
.menu a{display:block;line-height:60px;padding:0 23px;font-size:16px;color:var(--blanco);transition:color .15s}
.menu a:hover{color:var(--amarillo)}
.menu a.on{background:var(--azul);color:var(--amarillo)}
.menu a:first-child{padding-left:30px}
.menu a:last-child{padding-right:30px}
.cuenta{padding:0 20px!important}
.mhead .cuenta{padding:0 18px!important}
.cuenta{display:flex;align-items:center;gap:14px;background:var(--azul-menu);border-radius:999px;box-shadow:0 1px 4px rgba(179,179,179,.6);height:60px;padding:0 12px;font-size:16px;letter-spacing:.02em;color:#fff}
.cuenta svg{width:24px;height:24px}
.cuenta.on,.cuenta:hover{color:var(--amarillo)}
.panel{display:flex;gap:38px;align-items:flex-start}
.burger{display:none;background:var(--azul-menu);border:0;border-radius:50%;width:52px;height:52px;color:var(--blanco);box-shadow:0 1px 4px rgba(179,179,179,.6);cursor:pointer}
.burger svg{width:26px;height:26px}

/* menú celular */
.mfondo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
.mpanel{position:fixed;top:0;right:0;bottom:0;width:min(76vw,320px);background:var(--azul);z-index:71;transform:translateX(100%);transition:transform .32s ease;padding:calc(env(safe-area-inset-top,0px) + 38px) 0 30px;overflow-y:auto;display:flex;flex-direction:column;color:var(--blanco)}
.mopen .mfondo{opacity:1;pointer-events:auto}
.mopen .mpanel{transform:none}
body.mopen{overflow:hidden}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 20px}
.mhead .cuenta{height:46px;font-size:19px;padding:0 13px;gap:22px}
.mhead .cuenta svg{width:28px;height:28px}
.mclose{background:none;border:0;color:var(--blanco);width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.mclose svg{width:28px;height:28px}
.mnav{margin-top:30px;display:flex;flex-direction:column}
.mnav a,.mnav button.mdrop{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:62px;padding:0 54px 0 34px;font-weight:600;font-size:25px;color:var(--blanco);background:none;border:0;text-align:left;cursor:pointer}
.mnav a.on{color:var(--amarillo)}
.mdrop svg{width:18px;height:18px;transition:transform .2s;flex:none}
.mdrop[aria-expanded="true"] svg{transform:rotate(180deg)}
.msub{display:none;flex-direction:column}
.msub.open{display:flex}
.msub a{min-height:46px;font-size:19px;padding-left:54px}

/* ---------- PERFIL ---------- */
main{max-width:960px;margin:0 auto;padding:122px 0 60px}
h1{font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.perfil{display:grid;grid-template-columns:178px 1fr;column-gap:50px;margin-top:18px}
.foto{display:flex;flex-direction:column;align-items:center}
.avatar{width:178px;height:178px;border-radius:50%;overflow:hidden;background:#A9AAAC;box-shadow:0 0 0 4px #fff,0 4px 14px rgba(0,0,0,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;font-size:14px;font-weight:600;height:36px;padding:0 20px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn svg{width:15px;height:15px;flex:none}
.btn-azul{background:var(--azul-menu);color:#fff;margin-top:16px}
.btn-rojo{background:var(--rojo);color:#fff}

.campos{display:grid;grid-template-columns:200px 300px 180px;column-gap:24px;row-gap:24px;align-content:start}
.campo{display:flex;flex-direction:column;gap:8px}
.campo label,.campo .lbl{font-size:15px;font-weight:600}
.campo .dato{font-size:15px;font-weight:500;min-height:22px;color:#3A3F47}
.campo.c1{grid-column:1}.campo.c2{grid-column:2}.campo.c3{grid-column:3}
.campo.ancho{grid-column:2 / span 2}
.campo.c2 > input{width:180px}
.doble{display:flex;gap:14px}
.campo select.codigo{width:auto;flex:none}
.emergencia{grid-column:1 / -1;display:grid;grid-template-columns:200px 180px;column-gap:24px}
.emergencia .lbl{grid-column:1 / -1;margin-bottom:8px;font-size:15px}
.acciones{display:flex;justify-content:flex-end;margin-top:200px;padding-right:0}

/* ---------- RESPONSIVE ---------- */
@media (max-width:980px){
  .panel{display:none}
  .burger{display:grid;place-items:center}
  main{padding:110px 24px 60px}
  .perfil{grid-template-columns:1fr;row-gap:30px}
  .campos{grid-template-columns:1fr 1fr;column-gap:16px}
  .campo.c1,.campo.c2,.campo.c3,.campo.ancho{grid-column:auto}
  .campo.c2 > input{width:100%}
  .emergencia{grid-template-columns:1fr 1fr;column-gap:16px}
  .acciones{margin-top:60px;justify-content:center}
}
@media (max-width:520px){
  .campos{grid-template-columns:1fr}
  .emergencia{grid-template-columns:1fr;row-gap:12px}
  .emergencia .lbl{margin-bottom:-3px}
}

/* ---------- Menú: ítem seleccionado como pastilla de alto completo ---------- */
.menu{padding:0;align-items:stretch}
.menu a,.menu a:first-child,.menu a:last-child{line-height:60px;padding:0 24px;border-radius:999px;transition:color .15s,background .15s}
.menu a.on{background:var(--azul);color:var(--amarillo)}
.menu a:not(.on):hover{color:var(--amarillo)}
.mnav{padding:0 10px;gap:2px}
.mnav a,.mnav button.mdrop{border-radius:999px;min-height:58px;padding:0 44px 0 24px;transition:background .15s}
.mnav a.on{background:var(--azul-menu);color:var(--amarillo)}
.msub{padding-left:14px}
.msub a{min-height:46px;padding-left:26px}

/* ---------- Menú en la misma posición en todas las páginas ---------- */
html{scrollbar-gutter:stable}
.top .wrap{max-width:none;position:static}
.right{top:calc(24px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));gap:38px}
.menu a,.menu a:first-child,.menu a:last-child{font-size:16px;letter-spacing:0}
.cuenta{height:60px;gap:14px;font-size:16px;letter-spacing:.02em;padding:0 22px!important}
.mhead .cuenta{height:46px;font-size:19px;gap:22px;padding:0 18px!important}

/* Campos con el estilo nativo del navegador */
.campo input,.campo select,.emergencia input{font-size:16px;width:100%;box-sizing:border-box}
.doble select{width:auto}

/* Burbuja del menú que se desliza de página en página (escritorio) */
@media (min-width:981px){@view-transition{navigation:auto}}
.menu{position:relative}
.menu-pill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--azul);view-transition-name:menu-pill;pointer-events:none}
.menu a{position:relative;z-index:1}
.menu.con-pill a.on{background:transparent}
.menu a:nth-of-type(1){view-transition-name:menu-1}
.menu a:nth-of-type(2){view-transition-name:menu-2}
.menu a:nth-of-type(3){view-transition-name:menu-3}
.menu a:nth-of-type(4){view-transition-name:menu-4}
::view-transition-group(menu-pill){animation-duration:.4s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-group(menu-1),::view-transition-group(menu-2),::view-transition-group(menu-3),::view-transition-group(menu-4){animation-duration:.4s}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 21.5v-2.5a5 5 0 0 1 5-5h7a5 5 0 0 1 5 5v2.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="plus" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="salir" viewBox="0 0 24 24"><circle cx="10" cy="7.5" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 21v-1.5a5 5 0 0 1 5-5h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M16 15.5l5 5M21 15.5l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
</svg>

<!-- MENÚ -->
<div class="right">
  <div class="panel">
    <nav class="menu" aria-label="Menú principal">
      <a href="index.html">Inicio</a>
      <a data-link="inscripciones">Inscripciones</a>
      <a data-link="ranking">Ranking</a>
      <a data-link="bases">Bases</a>
    </nav>
    <a class="cuenta" href="mi-cuenta.html" aria-current="page">Mi cuenta <svg><use href="#user"/></svg></a>
  </div>
  <button class="burger" id="burger" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</div>

<main>
  <h1>Tu perfil:</h1>

  <form class="perfil" id="perfil" autocomplete="on">
    <div class="foto">
      <div class="avatar"><img id="fotoPerfil" src="img/avatar.png" alt="Foto de perfil"></div>
      <label class="btn btn-azul" for="subirFoto">actualizar <svg><use href="#plus"/></svg></label>
      <input type="file" id="subirFoto" accept="image/*" hidden>
    </div>

    <div class="campos">
      <div class="campo c1"><span class="lbl">DNI/CE:</span><span class="dato" data-campo="documento">—</span></div>
      <div class="campo ancho"><span class="lbl">Correo electrónico:</span><span class="dato" data-campo="correo">—</span></div>

      <div class="campo c1"><label for="nombre">Nombre:</label><input id="nombre" name="nombre" autocomplete="given-name"></div>
      <div class="campo c2"><label for="apellido">Apellido:</label><input id="apellido" name="apellido" autocomplete="family-name"></div>

      <div class="campo c1"><label for="nacimiento">Fecha de nacimiento:</label><input id="nacimiento" name="nacimiento" type="date" autocomplete="bday"></div>
      <div class="campo c2">
        <label for="celular">Celular:</label>
        <div class="doble">
          <select class="codigo" name="codigo" aria-label="Código de país">
            <option value="+51" selected>PER +51</option>
            <option value="+54">ARG +54</option>
            <option value="+591">BOL +591</option>
            <option value="+55">BRA +55</option>
            <option value="+56">CHL +56</option>
            <option value="+57">COL +57</option>
            <option value="+593">ECU +593</option>
            <option value="+34">ESP +34</option>
            <option value="+1">USA +1</option>
            <option value="+58">VEN +58</option>
          </select>
          <input id="celular" name="celular" type="tel" inputmode="tel" autocomplete="tel-national">
        </div>
      </div>
      <div class="campo c3 ig"><label for="instagram">Instagram:</label><input id="instagram" name="instagram" autocapitalize="off" spellcheck="false"></div>

      <div class="emergencia">
        <span class="lbl">Contacto de emergencia:</span>
        <input name="emergencia_nombre" aria-label="Nombre del contacto de emergencia" placeholder="Nombre">
        <input name="emergencia_celular" type="tel" inputmode="tel" aria-label="Celular del contacto de emergencia" placeholder="Celular">
      </div>
    </div>
  </form>

  <div class="acciones">
    <button class="btn btn-rojo" id="cerrarSesion" type="button">cerrar sesión <svg><use href="#salir"/></svg></button>
  </div>
</main>

<!-- MENÚ CELULAR -->
<div class="mfondo" id="mfondo" hidden></div>
<aside class="mpanel" id="mpanel" aria-label="Menú" hidden>
  <div class="mhead">
    <a class="cuenta" href="mi-cuenta.html">Mi cuenta <svg><use href="#user"/></svg></a>
    <button class="mclose" id="mclose" aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <nav class="mnav">
    <a href="index.html">Inicio</a>
    <a data-link="inscripciones">Inscripciones</a>
    <button class="mdrop" id="mdrop" aria-expanded="false">Partidos <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="msub" id="msub">
      <a data-link="ronda1">Ronda 1</a>
      <a data-link="ronda2">Ronda 2</a>
    </div>
    <a data-link="ranking">Ranking</a>
    <a data-link="bases">Bases</a>
    <a data-link="umaGo">Uma Go</a>
  </nav>
</aside>

<script>
/* Links del menú (los mismos que en index.html) */
const LINKS = {
  inscripciones: "inscripciones.html",
  ranking:       "ranking.html",
  nosotros:      "https://www.muevete.pe/nosotros",
  bases:         "bases.html",
  umaGo:         "",
  ronda1:        "https://www.muevete.pe/playa/sombrillas1/ronda/1",
  ronda2:        "https://www.muevete.pe/playa/sombrillas1/ronda/2",
};

/* ===== Conexión con la base de datos (pendiente) =====
   cargarPerfil(): debe devolver los datos del usuario que inició sesión.
   guardarPerfil(datos): debe guardar los cambios.
   Por ahora no hay base de datos conectada: la página no guarda nada. */
async function cargarPerfil(){ return null; }
async function guardarPerfil(datos){ /* conectar con la base de datos */ }

(function(){
  const $=s=>document.querySelector(s);
  document.querySelectorAll('[data-link]').forEach(a=>a.href=LINKS[a.dataset.link]||'#');

  // rellenar el formulario si hay datos
  cargarPerfil().then(p=>{
    if(!p) return;
    document.querySelectorAll('[data-campo]').forEach(e=>e.textContent=p[e.dataset.campo]||'—');
    const f=$('#perfil');
    for(const [k,v] of Object.entries(p)){ if(f.elements[k]) f.elements[k].value=v??''; }
    if(p.foto) $('#fotoPerfil').src=p.foto;
  });

  // guardar al cambiar un campo
  $('#perfil').addEventListener('change',e=>{
    if(e.target.id==='subirFoto') return;
    guardarPerfil(Object.fromEntries(new FormData($('#perfil'))));
  });

  // vista previa de la foto
  $('#subirFoto').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    $('#fotoPerfil').src=URL.createObjectURL(f);
  });

  // menú celular
  const mp=$('#mpanel'),mf=$('#mfondo'); let cierre;
  const menu=open=>{clearTimeout(cierre);
    if(open){mp.hidden=false;mf.hidden=false;mp.offsetWidth;requestAnimationFrame(()=>document.body.classList.add('mopen'));}
    else{document.body.classList.remove('mopen');cierre=setTimeout(()=>{mp.hidden=true;mf.hidden=true;},340);}};
  $('#burger').onclick=()=>menu(true); $('#mclose').onclick=()=>menu(false); mf.onclick=()=>menu(false);
  addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
  $('#mdrop').onclick=e=>{const o=e.currentTarget.getAttribute('aria-expanded')!=='true';e.currentTarget.setAttribute('aria-expanded',o);$('#msub').classList.toggle('open',o)};
})();
</script>
<script src="js/menu-pill.js"></script>
</body>
</html>
